name: Pubblica Rassegna SAVT su GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Forza aggiornamento pagina principale
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<meta name="savt-build" content="2026-09-14-0730">'
          if marker not in text:
              text = text.replace('<head>', '<head>\n' + marker)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Carica sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
